<!doctype html><meta charset=utf-8>
<style>
@font-face{font-family:Maru;src:url(zen-maru-gothic-japanese-700-normal.woff2);font-weight:700}
@font-face{font-family:Maru;src:url(zen-maru-gothic-japanese-900-normal.woff2);font-weight:900}
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{font-family:Maru,sans-serif;color:#2b2f3d;background:linear-gradient(120deg,#ffe9d2,#fff3e3 45%,#e3ebfb)}
/* slide card */
.card{position:absolute;left:250px;top:46px;width:1420px;height:780px;background:#fffaf2;border:6px solid #3b3f4e;border-radius:44px;
 background-image:radial-gradient(#e7dccb 2.2px,transparent 2.4px);background-size:34px 34px;box-shadow:0 14px 0 #3b3f4e22}
.chap{position:absolute;left:-14px;top:-30px;background:#2f4a8a;color:#fff;font-weight:900;font-size:40px;padding:12px 40px;border-radius:999px;border:6px solid #fffaf2}
.prog{position:absolute;right:30px;top:-26px;display:flex;gap:10px}
.prog span{width:76px;height:56px;border-radius:999px;background:#fff;border:4px solid #3b3f4e;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center}
.prog .on{background:#2f4a8a;color:#fff}
.src{position:absolute;right:40px;top:42px;font-size:22px;color:#7b7f8c;font-weight:700}
h1{position:absolute;top:84px;width:100%;text-align:center;font-size:84px;font-weight:900}
.flow{position:absolute;top:270px;left:0;width:100%;display:flex;justify-content:center;align-items:center;gap:30px}
.box{width:300px;height:280px;background:#fff;border:6px solid #3b3f4e;border-radius:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.box .e{font-size:120px;line-height:1}.box .l{font-size:44px;font-weight:900}
.box.o{background:#fff1e2;border-color:#f08a3c;width:360px}
.arr{font-size:96px;font-weight:900;color:#f08a3c}
.line{position:absolute;top:610px;width:100%;text-align:center;font-size:62px;font-weight:900}
.hl{background:linear-gradient(90deg,#ffcf9e 50%,transparent 50%);background-size:200% 60%;background-repeat:no-repeat;background-position:100% 85%}
/* reveal system: hidden until body has step >= n */
[data-step]{opacity:0}
.show{opacity:1;animation:var(--a) .45s cubic-bezier(.2,.9,.3,1.3) both}
.pop{--a:pop}.up{--a:up}.draw{--a:draw}
@keyframes pop{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
@keyframes up{0%{opacity:0;transform:translateY(40px)}100%{opacity:1;transform:none}}
@keyframes draw{0%{opacity:0;clip-path:inset(0 100% 0 0)}100%{opacity:1;clip-path:inset(0 0 0 0)}}
.hl.show{animation:up .4s both, sweep .6s .35s ease-out both}
@keyframes sweep{to{background-position:0 85%}}
/* characters */
.ch{position:absolute;bottom:0;height:560px;transition:filter .2s, transform .15s}
.mirai{left:-10px}.hinata{right:0}
.dim{filter:brightness(.82)}
.hop{animation:hop .3s ease-out}
@keyframes hop{50%{transform:translateY(-14px)}}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
/* subtitle */
.sub{position:absolute;bottom:42px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:22px}
.face{width:120px;height:120px;border-radius:50%;border:7px solid #fff;overflow:hidden;background:#fff;box-shadow:0 0 0 6px var(--c)}
.face img{width:220px;margin-left:-50px;margin-top:-6px}
.txt{font-size:64px;font-weight:900;color:#fff;line-height:1.2;-webkit-text-stroke:14px var(--c);paint-order:stroke fill;white-space:nowrap}
</style>
<body>
<div class=card>
 <div class=chap>01 ・ しくみ</div>
 <div class=prog><span class=on>01</span><span>02</span><span>03</span><span>04</span></div>
 <div class=src>出典：ディスコ 中間期決算短信（2026年10月）</div>
 <h1 data-step=1 class=up>AIはどこで考えてる？</h1>
 <div class=flow>
  <div class="box" data-step=2 class2=pop><div class=e>📱</div><div class=l>質問する</div></div>
  <div class="arr draw" data-step=3>➜</div>
  <div class="box o" data-step=3><div class=e>🏢</div><div class=l>計算センター</div></div>
  <div class="arr draw" data-step=4>➜</div>
  <div class="box" data-step=4><div class=e>💬</div><div class=l>答えが届く</div></div>
 </div>
 <div class=line data-step=5>みんな一斉に質問すると <span class="hl" data-step=6>レジの大行列！</span></div>
</div>
<img class="ch mirai bob" id=mirai src=m_closed.png>
<img class="ch hinata bob" id=hinata src=h_open.png>
<div class=sub id=sub style="--c:#f08a3c"><div class=face><img id=faceimg src=h_open.png></div><div class=txt id=txt></div></div>
<script>
document.querySelectorAll('[data-step]').forEach(e=>{e.classList.add(e.classList.contains('arr')?'draw':(e.classList.contains('box')?'pop':(e.classList.contains('hl')?'x':'up')))});
const lines=[
 {who:'h',t:'AIって、どこで\n考えてるんですか？',step:1,dur:2600},
 {who:'m',t:'あなたが質問すると…',step:2,dur:2000},
 {who:'m',t:'遠くの「計算センター」に\n届きます',step:3,dur:2600},
 {who:'m',t:'そこで計算して、\n答えを返すんです',step:4,dur:2400},
 {who:'h',t:'みんなが一度に\n質問したら…？',step:5,dur:2300},
 {who:'m',t:'そう、レジの\n大行列になります',step:6,dur:2600},
];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let cur=0;
function setStep(n){document.querySelectorAll('[data-step]').forEach(e=>{if(+e.dataset.step<=n&&!e.classList.contains('show'))e.classList.add('show')})}
(async()=>{await sleep(500);
for(const L of lines){
  setStep(L.step);
  const sp=L.who=='m'?mirai:hinata, other=L.who=='m'?hinata:mirai;
  sp.classList.remove('dim');other.classList.add('dim');
  sp.classList.remove('hop');void sp.offsetWidth;sp.classList.add('hop');
  sub.style.setProperty('--c',L.who=='m'?'#2f4a8a':'#f08a3c');
  faceimg.src=L.who=='m'?'m_closed.png':'h_open.png';
  txt.innerHTML=L.t.replace('\n','<br>');
  const end=Date.now()+L.dur;let o=false;
  while(Date.now()<end){ if(L.who=='m'){mirai.src=(o=!o)?'m_open.png':'m_closed.png'} await sleep(140)}
  mirai.src='m_closed.png'; await sleep(250);
}
document.title='done';})();
</script>
