<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden}
body{font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif;font-weight:900;position:relative;
 background:radial-gradient(ellipse 70% 90% at 30% 40%,#3a2a8c 0%,#1a1550 45%,#0b0a24 100%)}
/* sunburst */
.rays{position:absolute;left:-340px;top:-560px;width:1600px;height:1600px;
 background:repeating-conic-gradient(from 0deg,rgba(255,214,64,.16) 0deg 6deg,rgba(255,214,64,0) 6deg 15deg);
 -webkit-mask:radial-gradient(circle,#000 0%,#000 25%,transparent 62%);mask:radial-gradient(circle,#000 0%,#000 25%,transparent 62%)}
/* wafer */
.wafer{position:absolute;right:120px;top:40px;width:560px;height:560px;border-radius:50%;
 background:
  repeating-linear-gradient(0deg,rgba(255,255,255,.22) 0 2px,transparent 2px 34px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 2px,transparent 2px 34px),
  conic-gradient(from 200deg,#6fe3ff,#b48cff,#ff8ad8,#ffd36b,#7dffb5,#6fe3ff);
 opacity:.55;box-shadow:0 0 80px 10px rgba(130,180,255,.45);filter:saturate(1.2)}
.wafer::after{content:"";position:absolute;inset:0;border-radius:50%;
 background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 45%)}
.wafer::before{content:"";position:absolute;bottom:-6px;left:50%;width:70px;height:14px;margin-left:-35px;background:#0b0a24}
/* characters */
.char{position:absolute;bottom:-10px;filter:
 drop-shadow(0 0 0 #fff) drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 5px 0 #fff) drop-shadow(0 -5px 0 #fff)
 drop-shadow(0 0 22px rgba(255,210,80,.65))}
.mirai{right:-30px;height:760px}
.hinata{right:400px;height:600px;bottom:-210px}
/* text */
.l1{position:absolute;left:34px;top:30px;padding:6px 26px 10px;background:#e5322d;color:#fff;font-size:60px;letter-spacing:.01em;
 transform:skew(-8deg);box-shadow:8px 8px 0 #0b0a24;border:4px solid #fff}
.l1 span{display:inline-block;transform:skew(8deg)}
.t{position:absolute;left:30px;white-space:nowrap;paint-order:stroke fill;line-height:1}
.l2{top:150px;font-size:104px;color:#fff;-webkit-text-stroke:18px #0b0a24;letter-spacing:-.02em}
.l3{top:270px;font-size:178px;color:#ffe03a;-webkit-text-stroke:24px #0b0a24;letter-spacing:-.04em;
 text-shadow:10px 12px 0 #e5322d;transform:rotate(-3deg);transform-origin:left center}
.l3 small{font-size:130px}
/* bottom band */
.band{position:absolute;left:-20px;bottom:44px;padding:12px 40px 16px 56px;background:#fff;color:#0b0a24;font-size:58px;
 transform:skew(-10deg);border:5px solid #0b0a24;box-shadow:10px 10px 0 #e5322d}
.band span{display:inline-block;transform:skew(10deg)}
.band b{color:#e5322d}
/* burst badge */
.burst{position:absolute;left:700px;top:24px;width:230px;height:230px;display:grid;place-items:center;text-align:center;
 background:#ffe03a;color:#e5322d;
 clip-path:polygon(50% 0%,59% 13%,74% 5%,76% 21%,93% 20%,87% 36%,100% 46%,88% 56%,97% 72%,80% 74%,79% 91%,64% 85%,54% 100%,45% 87%,30% 96%,27% 80%,10% 82%,15% 66%,0% 56%,12% 45%,3% 29%,20% 26%,21% 9%,37% 15%);
 transform:rotate(8deg)}
.burst div{line-height:1;transform:rotate(-2deg)}
.burst .s{font-size:36px;color:#0b0a24}
.burst .b{font-size:84px;letter-spacing:-.04em}
.burst .b small{font-size:44px}
.burstbg{position:absolute;left:692px;top:16px;width:246px;height:246px;background:#0b0a24;
 clip-path:inherit;transform:rotate(8deg)}
</style></head><body>
<div class="rays"></div>
<div class="wafer"></div>
<img class="char mirai" src="../../assets/characters/mirai/transparent/mirai_08_smug.png">
<img class="char hinata" src="../../assets/characters/hinata/transparent/hinata_06_surprise.png">
<div class="l1"><span>AIの返事が遅いと…</span></div>
<div class="t l2">この会社が</div>
<div class="t l3">儲かる<small>！？</small></div>
<div class="band"><span>削る名人<b>「ディスコ」</b></span></div>
<div class="burstbg" style="clip-path:polygon(50% 0%,59% 13%,74% 5%,76% 21%,93% 20%,87% 36%,100% 46%,88% 56%,97% 72%,80% 74%,79% 91%,64% 85%,54% 100%,45% 87%,30% 96%,27% 80%,10% 82%,15% 66%,0% 56%,12% 45%,3% 29%,20% 26%,21% 9%,37% 15%)"></div>
<div class="burst"><div><div class="s">売上</div><div class="b">1.4<small>倍</small></div></div></div>
</body></html>
