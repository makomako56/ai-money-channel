    笑顔: hinata_05_smile.png
    驚き: hinata_06_surprise.png
    困り顔: hinata_07_troubled.png
    納得顔: hinata_10_happy.png
    ドヤ顔: hinata_08_smug.png
    疑問: hinata_09_question.png
    衝撃: hinata_11_shock.png
