  accent: "#fff1dc"
  voice:
    speed: 1.0
    pitch: 0.0  # AivisSpeechでは音質保持のため0
    intonation: 1.0  # AivisSpeechのスタイル強度は標準値
    volume: 1.0
    pre_phoneme: 0.05
    post_phoneme: 0.05
    pause_scale: 1.4  # VOICEVOXのみ適用。AivisSpeechでは警告して無視
    voices:
      aivisspeech: { name: コハク（ノーマル）, speaker_id: null }
      voicevox: { name: null, speaker_id: null, speed: 1.2, pitch: 0.02, intonation: 1.3 }
  fixed_traits: [明るい茶髪のボブ, オレンジのヘアピン, 茶色の瞳, 紺のブレザー制服, オレンジのリボン, 眼鏡なし]
  expressions:
