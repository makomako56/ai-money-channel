# 字幕の横の丸い顔アイコンは assets/characters/<キャラ>/face/ にある同じファイル名の画像（顔が中心になるよう切り出し済み・256×256）
# キャラ設定（Claudeの台本とCodexのパイプラインの共通定義）
mirai:
  display_name: ミライ
  full_name: 天野 ミライ
  role: 先生（解説役）
  position: left
  color: "#24345c"
  accent: "#c9a14a"
  voice:
    speed: 0.92
    pitch: -0.04  # AivisSpeechでは音質保持のため0
    intonation: 0.95  # AivisSpeechのスタイル強度は標準値
    volume: 1.0
    pre_phoneme: 0.05
    post_phoneme: 0.05
    pause_scale: 1.4  # VOICEVOXのみ適用。AivisSpeechでは警告して無視
    voices:
      aivisspeech: { name: まお（ノーマル）, speaker_id: null }
      voicevox: { name: null, speaker_id: null, speed: 1.1, pitch: -0.02, intonation: 1.2 }
  fixed_traits: [黒髪ロングの低い一つ結び, 細いフレームの眼鏡, グレーの瞳, ネイビーに金のふちのジャケット, 白いブラウス]
  expressions:
    通常: mirai_01_normal_closed.png
    笑顔: mirai_03_smile.png
    驚き: mirai_06_surprise.png
    困り顔: mirai_07_troubled.png
    ドヤ顔: mirai_08_smug.png
    疑問: mirai_09_question.png
    納得顔: mirai_10_happy.png
    ムッ: mirai_12_angry.png
    怒り: mirai_13_rage.png
    冷静: mirai_04_calm.png
    励まし: mirai_14_cheer.png
    落胆: mirai_15_sigh.png
  mouth: { closed: mirai_01_normal_closed.png, half: null, open: mirai_02_normal_open.png }
  blink: mirai_05_blink.png
hinata:
  display_name: ひなた
  full_name: 春野 ひなた
  role: 生徒（質問役）
  position: right
