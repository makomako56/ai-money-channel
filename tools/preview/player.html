<!doctype html><meta charset=utf-8>
<!-- Claude の確認用プレビュー（音声なし）。本番の動画は動画工場（Codex）が作る。使い方：リポジトリ直下で http サーバを立て /tools/preview/player.html?ep=ep001_disco -->
<style>
@font-face{font-family:Maru;src:url(../../assets/fonts/zen-maru-gothic-japanese-900-normal.woff2);font-weight:900}
*{margin:0}html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
iframe{position:absolute;inset:0;width:1920px;height:1080px;border:0}
.ch{position:absolute;bottom:0;height:560px;transition:filter .2s}
.dim{filter:brightness(.82)}
.mirai{left:-10px}.hinata{right:0}
body[data-layout=scene] .mirai{left:560px;height:640px}body[data-layout=scene] .hinata{right:520px;height:640px}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}
.m-ぴょん{animation:hop .3s ease-out}@keyframes hop{50%{transform:translateY(-16px)}}
.m-びくっ{animation:jolt .4s}@keyframes jolt{20%{transform:scale(.96)}40%{transform:translateX(-6px)}60%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
.m-うんうん{animation:nod .7s}@keyframes nod{25%,75%{transform:translateY(10px)}50%{transform:none}}
.m-かしげ{animation:tilt 1.2s forwards}@keyframes tilt{to{transform:rotate(-4deg)}}
.m-ずいっ{animation:lean .5s forwards}@keyframes lean{to{transform:translateY(-10px) scale(1.06)}}
.m-しょんぼり{animation:sag 1s forwards;filter:brightness(.75)}@keyframes sag{to{transform:translateY(16px)}}
.sub{position:absolute;bottom:42px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:22px}
.face{width:120px;height:120px;border-radius:50%;border:7px solid #fff;overflow:hidden;background:#fff;box-shadow:0 0 0 6px var(--c)}
.face img{width:100%;height:100%;display:block}
.txt{font-family:Maru,sans-serif;font-size:62px;font-weight:900;color:#fff;line-height:1.2;-webkit-text-stroke:14px var(--c);paint-order:stroke fill;white-space:nowrap}
</style>
<body><iframe id=pg></iframe>
<img class="ch mirai bob" id=mirai><img class="ch hinata bob" id=hinata>
<div class=sub id=sub><div class=face><img id=face></div><div class=txt id=txt></div></div>
<script>
const ep=new URLSearchParams(location.search).get('ep');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const IMG={ミライ:'../../assets/characters/mirai/transparent/',ひなた:'../../assets/characters/hinata/transparent/'};
let CH;
async function loadPage(n){pg.src=`../../episodes/${ep}/pages/${n}.html`;await new Promise(r=>pg.onload=r);await pg.contentDocument.fonts.ready;
 document.body.dataset.layout=pg.contentDocument.body.dataset.layout||'slide';setStep(1)}
function setStep(k){pg.contentDocument.querySelectorAll('[data-step]').forEach(e=>{if(+e.dataset.step<=k&&!e.classList.contains('show'))e.classList.add('show')})}
(async()=>{
 CH=await (await fetch('characters.json')).json();
 const lines=(await (await fetch(`../../episodes/${ep}/script.txt`)).text()).split('\n');
 mirai.src=IMG.ミライ+CH.ミライ.expressions['通常'];hinata.src=IMG.ひなた+CH.ひなた.expressions['通常'];
 let step=1,pend=false;const exp={ミライ:'通常',ひなた:'通常'};
 for(const raw of lines){const l=raw.trim();if(!l||l.startsWith('#'))continue;
  let m=l.match(/^\[画面: (\d+)\]/);if(m){await loadPage(m[1]);step=1;await sleep(500);continue}
  if(l.startsWith('[表示')){pend=true;continue}
  m=l.match(/^(ミライ|ひなた)「(.*)」(?:\{(.*)\})?$/);if(!m)continue;
  const [_,who,t,tag]=m;const [e,mo]=(tag||'通常').split('|');
  if(pend){step++;setStep(step);pend=false;await sleep(250)}
  exp[who]=(CH[who].expressions[e]?e:'通常');
  const me=who=='ミライ'?mirai:hinata, other=who=='ミライ'?hinata:mirai;
  me.classList.remove('dim');other.classList.add('dim');
  me.className=me.className.replace(/ m-\S+/g,'');void me.offsetWidth;me.classList.add('m-'+(mo||'ぴょん'));
  me.src=IMG[who]+CH[who].expressions[exp[who]];
  sub.style.setProperty('--c',who=='ミライ'?'#2f4a8a':'#f08a3c');face.src=IMG[who].replace('/transparent/','/face/')+CH[who].expressions[exp[who]];
  txt.innerHTML=t.replace('／','<br>');
  const dur=Math.max(1400,t.replace('／','').length*205);const end=Date.now()+dur;let o=false;
  while(Date.now()<end){o=!o;if(exp[who]=='通常')me.src=IMG[who]+(o?CH[who].mouth.open:CH[who].mouth.closed);await sleep(130)}
  me.src=IMG[who]+CH[who].expressions[exp[who]];await sleep(350);
 }
 await sleep(1200);document.title='done';
})();
(async()=>{while(true){await sleep(2800+Math.random()*1600);for(const [w,el] of [['ミライ',mirai],['ひなた',hinata]]){if(CH&&el.src.endsWith(CH[w].expressions['通常'])){el.src=IMG[w]+CH[w].blink;await sleep(110);el.src=IMG[w]+CH[w].expressions['通常']}}}})();
</script>
