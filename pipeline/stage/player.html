<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>recording</title>
<style>
@font-face{font-family:Maru;src:url(../../assets/fonts/zen-maru-gothic-japanese-900-normal.woff2);font-weight:900}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
iframe,.slideimg{position:absolute;inset:0;width:1920px;height:1080px;border:0}.slideimg{display:none;object-fit:contain;background:#fff}
.ch{position:absolute;bottom:0;height:560px;transition:filter .2s}.dim{filter:brightness(.82)}
.mirai{left:-10px}.hinata{right:0}
body[data-layout=scene] .mirai{left:560px;height:640px}body[data-layout=scene] .hinata{right:520px;height:640px}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}
.m-ぴょん{animation:hop .3s ease-out}@keyframes hop{50%{transform:translateY(-16px)}}
.m-びくっ{animation:jolt .4s}@keyframes jolt{20%{transform:scale(.96)}40%{transform:translateX(-6px)}60%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
.m-うんうん{animation:nod .7s}@keyframes nod{25%,75%{transform:translateY(10px)}50%{transform:none}}
.m-かしげ{animation:tilt 1.2s forwards}@keyframes tilt{to{transform:rotate(-4deg)}}
.m-ずいっ{animation:lean .5s forwards}@keyframes lean{to{transform:translateY(-10px) scale(1.06)}}
.m-しょんぼり{animation:sag 1s forwards;filter:brightness(.75)}@keyframes sag{to{transform:translateY(16px)}}
.sub{position:absolute;bottom:42px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:22px}
.face{width:120px;height:120px;border-radius:50%;border:7px solid #fff;overflow:hidden;background:#fff;box-shadow:0 0 0 6px var(--c)}
.face img{width:220px;margin-left:-50px;margin-top:-6px}
.txt{font-family:Maru,sans-serif;font-size:62px;font-weight:900;color:#fff;line-height:1.2;-webkit-text-stroke:14px var(--c);paint-order:stroke fill;white-space:nowrap}
.credit{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:#080c16;color:#fff;font:900 44px Maru,sans-serif}
body[data-credit="true"] .credit{display:flex}
</style>
<body>
<iframe id="pg"></iframe><img class="slideimg" id="slideimg" alt="">
<img class="ch mirai bob" id="mirai"><img class="ch hinata bob" id="hinata">
<div class="sub" id="sub"><div class="face"><img id="face"></div><div class="txt" id="txt"></div></div>
<div class="credit" id="credit"></div>
<script>
"use strict";
const params=new URLSearchParams(location.search),ep=params.get("ep");
const pg=document.getElementById("pg"),slideimg=document.getElementById("slideimg"),mirai=document.getElementById("mirai"),hinata=document.getElementById("hinata");
const sub=document.getElementById("sub"),face=document.getElementById("face"),txt=document.getElementById("txt"),credit=document.getElementById("credit");
if(!/^[a-zA-Z0-9_-]+$/.test(ep||""))throw Error("invalid episode");
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const IMG={ミライ:"../../assets/characters/mirai/transparent/",ひなた:"../../assets/characters/hinata/transparent/"};
const normalTag=tag=>{const [expression,motion]=String(tag||"通常").split("|");return {expression:expression||"通常",motion:motion||"ぴょん"}};
let CH,timeline=[],active=null,origin=null;
// 確認用の静止画のために、画面・段階が切り替わった時刻（録画の0秒基準）を記録する
window.__events=[];
function mark(screen,step){window.__events.push({screen,step,t:(performance.now()-origin)/1000})}
const chars={ミライ:document.getElementById("mirai"),ひなた:document.getElementById("hinata")};
function setStep(k){if(pg.style.display==="none")return;pg.contentDocument.querySelectorAll("[data-step]").forEach(e=>{if(+e.dataset.step<=k&&!e.classList.contains("show"))e.classList.add("show")})}
async function loadPage({kind,n}){
 if(kind==="スライド"){ // 旧書式：slides/NN.png を全面に表示（段階表示なし）
  slideimg.src=`../../episodes/${ep}/slides/${n}.png`;await slideimg.decode().catch(()=>{throw Error("slide load failed: "+n)});
  pg.style.display="none";slideimg.style.display="block";document.body.dataset.layout="slide";mark(n,1);return}
 pg.src=`../../episodes/${ep}/pages/${n}.html`;await new Promise((resolve,reject)=>{pg.onload=resolve;pg.onerror=()=>reject(Error("page load failed: "+n))});await pg.contentDocument.fonts.ready;
 slideimg.style.display="none";pg.style.display="block";document.body.dataset.layout=pg.contentDocument.body.dataset.layout||"slide";setStep(1);mark(n,1)}
function setText(value){value=String(value);if(!value.includes("／")&&value.length>16){const h=Math.ceil(value.length/2);value=value.slice(0,h)+"／"+value.slice(h)} // 旧書式は「／」がないので2行に折る
 txt.replaceChildren();String(value).split("／").forEach((part,index)=>{if(index)txt.append(document.createElement("br"));txt.append(document.createTextNode(part))})}
async function waitUntil(seconds,origin){while((performance.now()-origin)/1000<seconds)await sleep(Math.min(25,Math.max(1,(seconds-(performance.now()-origin)/1000)*1000)))}
function showLine(item,source){
 const match=source.match(/^(ミライ|ひなた)「(.*)」(?:\{(.*)\})?$/);if(!match)throw Error("script line does not match timeline line "+item.line);
 const [,,text,tag]=match,who=item.speaker,me=chars[who],other=chars[who==="ミライ"?"ひなた":"ミライ"];
 if(!me)throw Error("unknown speaker "+who);
 const {expression,motion}=normalTag(tag),safeExpression=CH[who].expressions[expression]?expression:"通常";
 active={item,who,expression:safeExpression,started:performance.now()};
 me.classList.remove("dim");other.classList.add("dim");me.className=me.className.replace(/ m-\S+/g,"");void me.offsetWidth;me.classList.add("m-"+motion);
 me.src=IMG[who]+CH[who].expressions[safeExpression];sub.style.setProperty("--c",who==="ミライ"?"#2f4a8a":"#f08a3c");
 face.src=me.src;setText(text);
}
function animate(){if(active){const {item,who,expression,started}=active,elapsed=(performance.now()-started)/1000,env=item.envelope;
 if(expression==="通常"){let open;if(Array.isArray(env)&&env.length){const fps=Number(item.envelope_fps)||30;open=Number(env[Math.min(env.length-1,Math.floor(elapsed*fps))]||0)>.012}else open=Math.floor(elapsed*7)%2===0;
 chars[who].src=IMG[who]+CH[who].mouth[open?"open":"closed"]}}
 requestAnimationFrame(animate)}
(async()=>{
 const [characterResponse,timelineResponse,scriptResponse,engineResponse]=await Promise.all([
 fetch("../../tools/preview/characters.json"),fetch(`../../output/${ep}/voice/timeline.json`),fetch(`../../episodes/${ep}/script.txt`),fetch(`../../output/${ep}/voice/engine.json`)]);
 for(const response of [characterResponse,timelineResponse,scriptResponse,engineResponse])if(!response.ok)throw Error("required recording input is missing: "+response.url);
 CH=await characterResponse.json();timeline=await timelineResponse.json();
 const script=(await scriptResponse.text()).split(/\r?\n/),engine=await engineResponse.json();
 if(!timeline.length)throw Error("timeline is empty");
 mirai.src=IMG.ミライ+CH.ミライ.expressions["通常"];hinata.src=IMG.ひなた+CH.ひなた.expressions["通常"];
 requestAnimationFrame(animate);
 let cursor=0,page=null,screen=null,step=1;origin=performance.now();window.__origin=performance.timeOrigin+origin;
 for(const item of timeline){
   const line=Number(item.line),source=script[line-1];if(!Number.isFinite(line)||!source)throw Error("timeline has invalid script line");
   await waitUntil(Number(item.start),origin);
   let shows=0;
   for(;cursor<line-1;cursor++){const marker=script[cursor].trim(),m=marker.match(/^\[(画面|スライド):\s*(\d+)\]$/);if(m){page={kind:m[1],n:String(+m[2]).padStart(2,"0")};shows=0}if(/^\[表示\]$/.test(marker))shows++}
   if(page!==null){await loadPage(page);screen=page;page=null;step=1}
   if(shows&&screen&&screen.kind==="画面"){step+=shows;setStep(step);mark(screen.n,step)}
   showLine(item,source);
   await waitUntil(Number(item.end),origin);active=null;
 }
 const end=Math.max(...timeline.map(item=>Number(item.end)));
 await waitUntil(end,origin);document.body.dataset.credit="true";credit.textContent="音声：AivisSpeech（まお・コハク）";
 await waitUntil(end+2,origin);document.title="done";
})().catch(error=>{document.title="error";document.body.dataset.error=error.message;console.error(error)});
(async()=>{while(true){await sleep(2800+Math.random()*1600);if(!CH)continue;for(const [who,el] of Object.entries(chars)){if(el.src.endsWith(CH[who].expressions["通常"])){el.src=IMG[who]+CH[who].blink;await sleep(110);if(!active||active.who!==who||active.expression==="通常")el.src=IMG[who]+CH[who].expressions["通常"]}}}})();
</script>
</body>
