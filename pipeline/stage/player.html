<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>recording</title>
<style>
@font-face{font-family:Maru;src:url(../../assets/fonts/zen-maru-gothic-japanese-900-normal.woff2);font-weight:900}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
iframe,.slideimg{position:absolute;inset:0;width:1920px;height:1080px;border:0}.slideimg{display:none;object-fit:contain;background:#fff}
.ch{z-index:4;position:absolute;bottom:0;height:560px;transition:filter .2s}.dim{filter:brightness(.82)}
.mirai{left:-10px}.hinata{right:0}
body[data-layout=scene] .mirai{left:560px;height:640px}body[data-layout=scene] .hinata{right:520px;height:640px}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}
.m-ぴょん{animation:hop .3s ease-out}@keyframes hop{50%{transform:translateY(-16px)}}
.m-びくっ{animation:jolt .4s}@keyframes jolt{20%{transform:scale(.96)}40%{transform:translateX(-6px)}60%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
.m-うんうん{animation:nod .7s}@keyframes nod{25%,75%{transform:translateY(10px)}50%{transform:none}}
.m-かしげ{animation:tilt 1.2s forwards}@keyframes tilt{to{transform:rotate(-4deg)}}
.m-ずいっ{animation:lean .5s forwards}@keyframes lean{to{transform:translateY(-10px) scale(1.06)}}
.m-しょんぼり{animation:sag 1s forwards;filter:brightness(.75)}@keyframes sag{to{transform:translateY(16px)}}
.sub{z-index:5;position:absolute;bottom:42px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:22px}
.face{width:120px;height:120px;border-radius:50%;border:7px solid #fff;overflow:hidden;background:#fff;box-shadow:0 0 0 6px var(--c)}
.face img{width:100%;height:100%;display:block}
.txt{font-family:Maru,sans-serif;font-size:62px;font-weight:900;color:#fff;line-height:1.2;-webkit-text-stroke:14px var(--c);paint-order:stroke fill;white-space:nowrap}
.credit{z-index:10;display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:#080c16;color:#fff;font:900 44px Maru,sans-serif}
body[data-credit="true"] .credit{display:flex}
.whiteboard{display:none;position:absolute;z-index:1;inset:0;background:#fdf6dc;color:#171717;font-family:Maru,"Noto Sans JP",sans-serif;overflow:hidden}
.wb-paper{position:absolute;inset:0;background:linear-gradient(90deg,rgba(196,165,112,.08) 1px,transparent 1px),linear-gradient(rgba(196,165,112,.08) 1px,transparent 1px),#fdf6dc;background-size:36px 36px}
.wb-heading{position:absolute;left:86px;top:72px;width:1748px;height:190px;font-size:76px;line-height:1.15;font-weight:900;border-bottom:8px solid #ed6e9d;letter-spacing:.01em}
.wb-heading span{display:block;width:0;overflow:hidden;white-space:nowrap;animation:writeTitle 1.15s steps(18,end) forwards}@keyframes writeTitle{to{width:100%}}
.wb-grid{position:absolute;left:74px;top:292px;width:1772px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:330px;gap:26px 28px}
.wb-item{opacity:0;transform:scale(.82) rotate(-2deg);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 18px 12px;border-radius:28px;background:rgba(255,255,255,.5);box-shadow:0 8px 0 rgba(102,75,31,.08);transition:opacity .48s,transform .48s}.wb-item.drawn{opacity:1;transform:scale(1) rotate(0)}
.wb-emoji{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;font-size:142px;line-height:1.22}.wb-caption{max-width:100%;font-size:34px;line-height:1.18;text-align:center;font-weight:900;white-space:nowrap}
.wb-hand{position:absolute;z-index:3;width:156px;height:114px;left:1920px;top:1080px;opacity:0;filter:drop-shadow(8px 12px 9px rgba(44,28,14,.2));transition:left .3s ease-in-out,top .3s ease-in-out,opacity .15s,transform .2s;transform:rotate(-5deg);pointer-events:none}.wb-hand.drawing{opacity:1}.wb-hand.leaving{left:1920px!important;top:1080px!important;opacity:0}
.wb-turn{position:absolute;z-index:2;inset:0;background:#fff9e7;transform-origin:right center;animation:pageTurn .55s ease-in forwards}@keyframes pageTurn{to{transform:perspective(900px) rotateY(-88deg);opacity:.15}}
.spotlight{display:none;z-index:6;position:absolute;left:0;right:0;bottom:0;height:126px;align-items:center;justify-content:center;background:#ed6e9d;color:#fff;font:900 66px Maru,sans-serif;letter-spacing:.04em;text-shadow:0 5px 0 #9e315a}
body[data-video-style=whiteboard] .whiteboard{display:block}body[data-video-style=whiteboard] iframe,body[data-video-style=whiteboard] .slideimg{display:none!important}
body[data-video-style=whiteboard] .ch{bottom:108px;height:552px}body[data-video-style=whiteboard] .mirai{left:1060px}body[data-video-style=whiteboard] .hinata{right:-18px}
body[data-video-style=whiteboard] .sub{left:1485px;bottom:485px;width:720px;min-height:180px;justify-content:center;padding:24px 34px;transform:translateX(-50%);border:7px solid #252525;border-radius:42px;background:#fff;box-shadow:0 12px 0 rgba(0,0,0,.12)}
body[data-video-style=whiteboard] .sub:after{content:"";position:absolute;bottom:-42px;left:var(--tail-x,58%);border:22px solid transparent;border-top-color:#252525}
body[data-video-style=whiteboard] .face{display:none}body[data-video-style=whiteboard] .txt{font-size:43px;line-height:1.25;color:#151515;text-align:center;-webkit-text-stroke:0;white-space:normal}
body[data-video-style=whiteboard] .spotlight:not([hidden]){display:flex}
</style>
<body>
<iframe id="pg"></iframe><img class="slideimg" id="slideimg" alt="">
<div class="whiteboard" id="whiteboard"><div class="wb-paper"><div class="wb-heading" id="wb-heading"></div><div class="wb-grid" id="wb-grid"></div><div id="wb-turn"></div></div><img class="wb-hand" id="wb-hand" src="../../assets/whiteboard/hand_marker.svg" alt=""></div>
<img class="ch mirai bob" id="mirai"><img class="ch hinata bob" id="hinata">
<div class="sub" id="sub"><div class="face"><img id="face"></div><div class="txt" id="txt"></div></div>
<div class="spotlight" id="spotlight" hidden></div>
<div class="credit" id="credit"></div>
<script>
"use strict";
const params=new URLSearchParams(location.search),ep=params.get("ep");
const pg=document.getElementById("pg"),slideimg=document.getElementById("slideimg"),mirai=document.getElementById("mirai"),hinata=document.getElementById("hinata");
const sub=document.getElementById("sub"),face=document.getElementById("face"),txt=document.getElementById("txt"),credit=document.getElementById("credit");
const wbHeading=document.getElementById("wb-heading"),wbGrid=document.getElementById("wb-grid"),wbHand=document.getElementById("wb-hand"),wbTurn=document.getElementById("wb-turn"),spotlight=document.getElementById("spotlight");
if(!/^[a-zA-Z0-9_-]+$/.test(ep||""))throw Error("invalid episode");
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const IMG={ミライ:"../../assets/characters/mirai/transparent/",ひなた:"../../assets/characters/hinata/transparent/"};
const normalTag=tag=>{const [expression,motion]=String(tag||"通常").split("|");return {expression:expression||"通常",motion:motion||"ぴょん"}};
let CH,timeline=[],active=null,origin=null,whiteboardMode=false,whiteboardPage=1,whiteboardStep=0,handTimer=null;
// 確認用の静止画のために、画面・段階が切り替わった時刻（録画の0秒基準）を記録する
window.__events=[];
function mark(screen,step){window.__events.push({screen,step,t:(performance.now()-origin)/1000})}
const chars={ミライ:document.getElementById("mirai"),ひなた:document.getElementById("hinata")};
function setStep(k){if(pg.style.display==="none")return;pg.contentDocument.querySelectorAll("[data-step]").forEach(e=>{if(+e.dataset.step<=k&&!e.classList.contains("show"))e.classList.add("show")})}
async function loadPage({kind,n}){
 if(kind==="スライド"){ // 旧書式：slides/NN.png を全面に表示（段階表示なし）
  slideimg.src=`../../episodes/${ep}/slides/${n}.png`;await slideimg.decode().catch(()=>{throw Error("slide load failed: "+n)});
  pg.style.display="none";slideimg.style.display="block";document.body.dataset.layout="slide";mark(n,1);return}
 pg.src=`../../episodes/${ep}/pages/${n}.html`;await new Promise((resolve,reject)=>{pg.onload=resolve;pg.onerror=()=>reject(Error("page load failed: "+n))});await pg.contentDocument.fonts.ready;
 slideimg.style.display="none";pg.style.display="block";document.body.dataset.layout=pg.contentDocument.body.dataset.layout||"slide";setStep(1);mark(n,1)}
function setText(value){value=String(value);if(!value.includes("／")&&value.length>16){const h=Math.ceil(value.length/2);value=value.slice(0,h)+"／"+value.slice(h)} // 旧書式は「／」がないので2行に折る
 txt.replaceChildren();String(value).split("／").forEach((part,index)=>{if(index)txt.append(document.createElement("br"));txt.append(document.createTextNode(part))})}
function drawWithHand(left,top,duration){
 clearTimeout(handTimer);wbHand.classList.remove("leaving");wbHand.style.left=left+"px";wbHand.style.top=top+"px";wbHand.style.transform="rotate("+(left%2?-8:-3)+"deg)";wbHand.classList.add("drawing");
 handTimer=setTimeout(()=>{wbHand.classList.remove("drawing");wbHand.classList.add("leaving")},duration)
}
function markWhiteboard(){whiteboardStep++;mark(String(whiteboardPage).padStart(2,"0"),whiteboardStep)}
function applyWhiteboardMarker(marker){
 if(marker==="[消す]"){
  whiteboardPage++;whiteboardStep=0;wbHeading.replaceChildren();wbGrid.replaceChildren();
  wbTurn.className="";void wbTurn.offsetWidth;wbTurn.className="wb-turn";wbHand.classList.remove("drawing");wbHand.classList.add("leaving");markWhiteboard();return true}
 let m=marker.match(/^\[手書き:\s*(.+)\]$/);if(m){
  const span=document.createElement("span");span.textContent=m[1].trim();wbHeading.replaceChildren(span);drawWithHand(1710,150,1450);markWhiteboard();return true}
 m=marker.match(/^\[絵:\s*([^|]+)\|\s*(.+)\]$/);if(m){
  const index=wbGrid.children.length;if(index>=6)throw Error("whiteboard has more than six pictures");
  const card=document.createElement("div"),emoji=document.createElement("div"),caption=document.createElement("div");
  card.className="wb-item";emoji.className="wb-emoji";caption.className="wb-caption";emoji.textContent=m[1].trim();caption.textContent=m[2].trim();card.append(emoji,caption);wbGrid.append(card);
  const column=index%3,row=Math.floor(index/3);drawWithHand(565+column*600,535+row*330,600);setTimeout(()=>card.classList.add("drawn"),260);markWhiteboard();return true}
 return false
}
async function waitUntil(seconds,origin){while((performance.now()-origin)/1000<seconds)await sleep(Math.min(25,Math.max(1,(seconds-(performance.now()-origin)/1000)*1000)))}
function showLine(item,source){
 const match=source.match(/^(ミライ|ひなた)「(.*)」(?:\{(.*)\})?$/);if(!match)throw Error("script line does not match timeline line "+item.line);
 const [,,,tag]=match,display=whiteboardMode?String(item.display_text||item.text):match[2],who=item.speaker,me=chars[who],other=chars[who==="ミライ"?"ひなた":"ミライ"];
 if(!me)throw Error("unknown speaker "+who);
 const {expression,motion}=normalTag(tag),safeExpression=CH[who].expressions[expression]?expression:"通常";
 active={item,who,expression:safeExpression,started:performance.now()};
 me.classList.remove("dim");other.classList.add("dim");me.className=me.className.replace(/ m-\S+/g,"");void me.offsetWidth;me.classList.add("m-"+motion);
 me.src=IMG[who]+CH[who].expressions[safeExpression];sub.style.setProperty("--c",who==="ミライ"?"#2f4a8a":"#f08a3c");
 face.src=me.src.replace('/transparent/','/face/');
 if(whiteboardMode){const hits=[...display.matchAll(/【([^【】]+)】/g)].map(m=>m[1]);spotlight.textContent=hits.join("　");spotlight.hidden=!hits.length;sub.style.setProperty("--tail-x",who==="ミライ"?"42%":"76%");setText(display.replace(/[【】]/g,""))}else setText(display);
}
function animate(){if(active){const {item,who,expression,started}=active,elapsed=(performance.now()-started)/1000,env=item.envelope;
 if(expression==="通常"){let open;if(Array.isArray(env)&&env.length){const fps=Number(item.envelope_fps)||30;open=Number(env[Math.min(env.length-1,Math.floor(elapsed*fps))]||0)>.012}else open=Math.floor(elapsed*7)%2===0;
 chars[who].src=IMG[who]+CH[who].mouth[open?"open":"closed"]}}
 requestAnimationFrame(animate)}
(async()=>{
 const [characterResponse,timelineResponse,scriptResponse,engineResponse,metaResponse]=await Promise.all([
 fetch("../../tools/preview/characters.json"),fetch(`../../output/${ep}/voice/timeline.json`),fetch(`../../episodes/${ep}/script.txt`),fetch(`../../output/${ep}/voice/engine.json`),fetch(`../../episodes/${ep}/meta.json`)]);
 for(const response of [characterResponse,timelineResponse,scriptResponse,engineResponse,metaResponse])if(!response.ok)throw Error("required recording input is missing: "+response.url);
 CH=await characterResponse.json();timeline=await timelineResponse.json();
 const script=(await scriptResponse.text()).split(/\r?\n/),engine=await engineResponse.json(),meta=await metaResponse.json();whiteboardMode=meta.video_style==="whiteboard";if(whiteboardMode)document.body.dataset.videoStyle="whiteboard";
 if(!timeline.length)throw Error("timeline is empty");
 mirai.src=IMG.ミライ+CH.ミライ.expressions["通常"];hinata.src=IMG.ひなた+CH.ひなた.expressions["通常"];
 requestAnimationFrame(animate);
 let cursor=0,page=null,screen=null,step=1;origin=performance.now();window.__origin=performance.timeOrigin+origin;
 for(const item of timeline){
   const line=Number(item.line),source=script[line-1];if(!Number.isFinite(line)||!source)throw Error("timeline has invalid script line");
   await waitUntil(Number(item.start),origin);
   let shows=0;
   for(;cursor<line-1;cursor++){const marker=script[cursor].trim();if(whiteboardMode&&applyWhiteboardMarker(marker))continue;const m=marker.match(/^\[(画面|スライド):\s*(\d+)\]$/);if(m){page={kind:m[1],n:String(+m[2]).padStart(2,"0")};shows=0}if(/^\[表示\]$/.test(marker))shows++}
   if(page!==null){await loadPage(page);screen=page;page=null;step=1}
   if(shows&&screen&&screen.kind==="画面"){step+=shows;setStep(step);mark(screen.n,step)}
   showLine(item,source);
   await waitUntil(Number(item.end),origin);active=null;spotlight.hidden=true;
 }
 const end=Math.max(...timeline.map(item=>Number(item.end)));
 await waitUntil(end,origin);document.body.dataset.credit="true";credit.textContent="音声：AivisSpeech（まお・コハク）";
 await waitUntil(end+2,origin);document.title="done";
})().catch(error=>{document.title="error";document.body.dataset.error=error.message;console.error(error)});
(async()=>{while(true){await sleep(2800+Math.random()*1600);if(!CH)continue;for(const [who,el] of Object.entries(chars)){if(el.src.endsWith(CH[who].expressions["通常"])){el.src=IMG[who]+CH[who].blink;await sleep(110);if(!active||active.who!==who||active.expression==="通常")el.src=IMG[who]+CH[who].expressions["通常"]}}}})();
</script>
</body>
