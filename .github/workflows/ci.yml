name: 音声工場 CI
on:
  pull_request:
    paths:
      - pipeline/**
      - config/**
      - .github/workflows/**
      - requirements.txt
permissions:
  contents: read
jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      engine: ${{ steps.engine.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - id: engine
        run: python -m pipeline.engine_config --github-output "$GITHUB_OUTPUT"
  voice:
    needs: config
    # The reusable workflow limits write access to its publish-review job.
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/factory.yml
    with:
      episode: ep000_sample
      stage: voice
      publish_review: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
  aivis-samples:
    needs: config
    # Cover the alternate engine's complete catalogue when the config selects it.
    if: needs.config.outputs.engine == 'aivisspeech'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/factory.yml
    with:
      episode: ep000_sample
      stage: voice_samples
      publish_review: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
