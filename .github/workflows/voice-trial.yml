# 一時的な試聴用（Claude作成）。声の選定が終わったら削除する。
name: 試聴（AivisSpeech）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      aivis:
        image: ghcr.io/aivis-project/aivisspeech-engine:cpu-latest
        ports: ["10101:10101"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Wait for engine
        run: |
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:10101/version && exit 0; sleep 5; done; exit 1
      - run: python3 tools/trial/aivis_trial.py out
      - name: Push to review-outputs
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git fetch origin review-outputs || true
          git checkout -B review-outputs origin/review-outputs 2>/dev/null || git checkout --orphan review-outputs
          git rm -rq --cached . 2>/dev/null || true
          rm -rf voice_trial && mkdir -p voice_trial && cp out/* voice_trial/
          git add voice_trial && git commit -m "AivisSpeech 試聴サンプル" && git push origin review-outputs
