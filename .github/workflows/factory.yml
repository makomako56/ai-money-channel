name: 動画工場（音声）
run-name: 音声生成 / ${{ inputs.episode }} / ${{ inputs.stage }}

on:
  workflow_dispatch:
    inputs:
      episode:
        description: エピソードのフォルダ名
        required: true
        default: ep000_sample
        type: string
      stage:
        description: 生成する成果物
        required: true
        default: voice
        type: choice
        options: [voice, voice_samples]
  workflow_call:
    inputs:
      episode:
        type: string
        default: ep000_sample
      stage:
        type: string
        default: voice
      publish_review:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.engine.outputs.image }}
      port: ${{ steps.engine.outputs.port }}
      engine: ${{ steps.engine.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - id: engine
        run: python -m pipeline.engine_config --github-output "$GITHUB_OUTPUT"

  generate:
    needs: configure
    name: ${{ inputs.stage }} (${{ needs.configure.outputs.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      EPISODE: ${{ inputs.episode }}
      STAGE: ${{ inputs.stage }}
      ENGINE_PORT: ${{ needs.configure.outputs.port }}
      PYTHONUNBUFFERED: '1'
    services:
      speech:
        image: ${{ needs.configure.outputs.image }}
        ports:
          - ${{ format('{0}:{0}', needs.configure.outputs.port) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 --globoff \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansjp/NotoSansJP[wght].ttf' \
            --output "$HOME/.local/share/fonts/NotoSansJP.ttf"
          fc-cache -f
          fc-match --format '%{family}\n' 'Noto Sans JP' | grep -F 'Noto Sans JP'
          python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s pipeline/tests -v
      - name: Wait for speech engine
        run: |
          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:$ENGINE_PORT/version"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo '::error::Speech engine did not become ready'
          exit 1
      - name: Generate audio
        run: python -m pipeline.make_voice --episode "$EPISODE" --stage "$STAGE"
      - name: Verify generated artifacts
        run: python -m pipeline.verify_output --episode "$EPISODE" --stage "$STAGE"
      - name: Upload original audio
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.episode }}-${{ inputs.stage }}
          path: output/${{ inputs.episode }}/${{ inputs.stage }}/
          if-no-files-found: error
          retention-days: 7
      - name: Prepare review copy
        run: python -m pipeline.prepare_review --episode "$EPISODE" --stage "$STAGE"
      - name: Upload review copy for publisher
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.episode }}-${{ inputs.stage }}-review
          path: output/review/${{ inputs.episode }}/${{ inputs.stage }}/
          if-no-files-found: error
          retention-days: 7
      - name: Engine logs on failure
        if: failure()
        env:
          ENGINE_CONTAINER: ${{ job.services.speech.id }}
        run: docker logs --tail 100 "$ENGINE_CONTAINER"

  publish-review:
    needs: generate
    # Fork PRs build and test, but cannot update the shared review branch.
    if: >-
      (github.event_name == 'workflow_dispatch' || inputs.publish_review) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: review-outputs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.episode }}-${{ inputs.stage }}-review
          path: review-input
      - name: Push only to review-outputs
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE: ${{ inputs.episode }}
          STAGE: ${{ inputs.stage }}
        run: python -m pipeline.publish_review --source review-input --episode "$EPISODE" --stage "$STAGE"
