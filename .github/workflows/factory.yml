name: 動画工場（音声・動画・サムネ）
run-name: ${{ inputs.stage }}生成 / ${{ inputs.episode }} / ${{ inputs.stage }}

on:
  workflow_dispatch:
    inputs:
      episode:
        description: エピソードのフォルダ名
        required: true
        default: ep000_sample
        type: string
      stage:
        description: 生成する成果物
        required: true
        default: voice
        type: choice
        options: [all, voice, video, thumbnail, voice_samples, upload, upload_check]
      source_run_id:
        description: 動画とサムネを生成したActions実行ID（upload時のみ）
        required: false
        type: string
      approval_json:
        description: オーナーの承認JSON（uploadまたはdo_upload=true時。リポジトリに保存しない）
        required: false
        type: string
      do_upload:
        description: stage=all の最後に予約投稿する
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      episode:
        type: string
        default: ep000_sample
      stage:
        type: string
        default: voice
      publish_review:
        type: boolean
        default: false
      source_run_id:
        type: string
        default: ''
      approval_json:
        type: string
        default: ''
      do_upload:
        type: boolean
        default: false
    secrets:
      PIXABAY_API_KEY:
        required: false
      PEXELS_API_KEY:
        required: false
      YT_CLIENT_ID:
        required: false
      YT_CLIENT_SECRET:
        required: false
      YT_REFRESH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  configure:
    if: inputs.stage != 'upload' && inputs.stage != 'upload_check'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image: ${{ steps.engine.outputs.image }}
      port: ${{ steps.engine.outputs.port }}
      engine: ${{ steps.engine.outputs.engine }}
      extra_models: ${{ steps.engine.outputs.extra_models }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - id: engine
        run: python -m pipeline.engine_config --github-output "$GITHUB_OUTPUT"

  generate:
    needs: configure
    name: ${{ inputs.stage }} (${{ needs.configure.outputs.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      EPISODE: ${{ inputs.episode }}
      STAGE: ${{ inputs.stage }}
      DO_UPLOAD: ${{ inputs.do_upload }}
      ENGINE_PORT: ${{ needs.configure.outputs.port }}
      ENGINE: ${{ needs.configure.outputs.engine }}
      ENGINE_IMAGE: ${{ needs.configure.outputs.image }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        timeout-minutes: 25
        run: |
          # apt on the runner's mirror stalls for 10+ minutes now and then (logs are not readable from Claude's side).
          # Use what the image already has, try apt once with a time limit, then fall back to a static ffmpeg build.
          source_note="preinstalled"
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! command -v fc-cache >/dev/null; then
            echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null || true
            sudo rm -f /var/lib/man-db/auto-update
            APT_OPTS='-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true -o DPkg::Lock::Timeout=60'
            if timeout 150 sudo apt-get $APT_OPTS update && \
               timeout 180 sudo apt-get $APT_OPTS install -y --no-install-recommends ffmpeg fontconfig; then
              source_note="apt"
            else
              sudo dpkg --configure -a || true
              source_note="static build (apt failed)"
            fi
          fi
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            mkdir -p "$RUNNER_TEMP/ffmpeg"
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
              'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz' \
              | tar -xJ -C "$RUNNER_TEMP/ffmpeg" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
            echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/ffmpeg:$PATH"
          fi
          echo "::notice title=ffmpeg::${source_note}: $(ffmpeg -version | head -1)"
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 --globoff \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansjp/NotoSansJP[wght].ttf' \
            --output "$HOME/.local/share/fonts/NotoSansJP.ttf"
          fc-cache -f
          fc-match --format '%{family}\n' 'Noto Sans JP' | grep -F 'Noto Sans JP'
          python -m pip install -r requirements.txt
      - name: Restore AivisHub models
        if: env.ENGINE == 'aivisspeech'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/aivis-engine/Models
          key: aivishub-aivmx-v1-${{ hashFiles('config/voice_engine.yaml') }}
      - name: Download missing AivisHub models
        if: env.ENGINE == 'aivisspeech'
        run: python -m pipeline.aivis_models --output "$RUNNER_TEMP/aivis-engine/Models"
      - name: Preflight (input check)
        id: preflight
        if: env.STAGE != 'voice_samples'
        run: python -m pipeline.preflight --episode "$EPISODE" --stage "$STAGE" --warnings-file "$RUNNER_TEMP/warnings.txt"
      - name: Install Playwright
        if: env.STAGE != 'voice' && env.STAGE != 'voice_samples'
        run: |
          npm install --prefix "$RUNNER_TEMP/video-playwright" playwright
          "$RUNNER_TEMP/video-playwright/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/video-playwright/node_modules" >> "$GITHUB_ENV"
      - name: Unit tests
        run: python -m unittest discover -s pipeline/tests -v
      - name: Start speech engine
        run: |
          mount_args=()
          if [ "$ENGINE" = aivisspeech ]; then
            mkdir -p "$RUNNER_TEMP/aivis-engine/Models"
            chmod -R a+rwX "$RUNNER_TEMP/aivis-engine"
            mount_args=(-v "$RUNNER_TEMP/aivis-engine:/home/user/.local/share/AivisSpeech-Engine-Dev")
          fi
          docker run --detach --name speech-engine \
            --publish "127.0.0.1:$ENGINE_PORT:$ENGINE_PORT" \
            "${mount_args[@]}" "$ENGINE_IMAGE"
      - name: Wait for speech engine
        run: |
          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:$ENGINE_PORT/version"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo '::error::Speech engine did not become ready'
          exit 1
      - name: Generate audio
        if: env.STAGE == 'voice' || env.STAGE == 'voice_samples'
        run: python -m pipeline.make_voice --episode "$EPISODE" --stage "$STAGE"
      - name: Generate voice timeline for video
        id: voice
        if: (env.STAGE == 'video' || env.STAGE == 'all')
        run: python -m pipeline.make_voice --episode "$EPISODE" --stage voice
      - name: Restore stock video cache
        if: (env.STAGE == 'video' || env.STAGE == 'all')
        uses: actions/cache@v4
        with:
          path: .cache/broll
          key: broll-v2-${{ inputs.episode }}-${{ hashFiles('episodes/**/script.txt', 'config/broll.yaml') }}
          restore-keys: broll-v2-${{ inputs.episode }}-
      - name: Fetch b-roll clips
        id: broll
        if: (env.STAGE == 'video' || env.STAGE == 'all')
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python -m pipeline.make_broll --episode "$EPISODE"
      - name: Record and assemble video
        id: video
        if: (env.STAGE == 'video' || env.STAGE == 'all')
        run: python -m pipeline.make_video --episode "$EPISODE"
      - name: Generate thumbnail
        id: thumbnail
        if: (env.STAGE == 'thumbnail' || env.STAGE == 'all')
        run: python -m pipeline.make_thumbnail --episode "$EPISODE"
      - name: Verify generated artifacts
        if: env.STAGE == 'voice' || env.STAGE == 'voice_samples'
        run: python -m pipeline.verify_output --episode "$EPISODE" --stage "$STAGE"
      - name: Upload original audio
        if: env.STAGE == 'voice' || env.STAGE == 'voice_samples'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.episode }}-${{ inputs.stage }}
          path: output/${{ inputs.episode }}/${{ inputs.stage }}/
          if-no-files-found: error
          retention-days: 7
      # The upload job (04) downloads <ep>-video and <ep>-thumbnail by run id, for stage=all too.
      - name: Upload original video
        if: (env.STAGE == 'video' || env.STAGE == 'all')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.episode }}-video
          path: output/${{ inputs.episode }}/video/
          if-no-files-found: error
          retention-days: 7
      - name: Upload original thumbnail
        if: (env.STAGE == 'thumbnail' || env.STAGE == 'all')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.episode }}-thumbnail
          path: output/${{ inputs.episode }}/thumbnail/
          if-no-files-found: error
          retention-days: 7
      - name: Prepare review copy
        if: env.STAGE == 'voice' || env.STAGE == 'voice_samples'
        run: python -m pipeline.prepare_review --episode "$EPISODE" --stage "$STAGE"
      - name: Check video review copy
        if: (env.STAGE == 'video' || env.STAGE == 'all')
        # make_video.py writes the 854x480 copy and frames/NN-S.png in the same pass as the master.
        run: |
          size=$(stat -c '%s' "output/review/$EPISODE/video/video.mp4")
          frames=$(find "output/review/$EPISODE/video/frames" -name '*.png' | wc -l)
          echo "review video: $size bytes, frames: $frames"
          [ "$size" -lt 100000000 ] && [ "$frames" -gt 0 ]
      - name: Prepare thumbnail review copy
        if: (env.STAGE == 'thumbnail' || env.STAGE == 'all')
        run: |
          mkdir -p "output/review/$EPISODE/thumbnail"
          cp "output/$EPISODE/thumbnail/thumbnail.png" "output/review/$EPISODE/thumbnail/thumbnail.png"
      - name: Upload review copy for publisher
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.episode }}-${{ inputs.stage }}-review
          # stage=all keeps video/ and thumbnail/ side by side; single stages upload their own folder.
          path: output/review/${{ inputs.episode }}/${{ inputs.stage != 'all' && inputs.stage || '' }}
          if-no-files-found: error
          retention-days: 7
      - name: Write temporary approval for stage=all upload
        if: env.STAGE == 'all' && inputs.do_upload
        env:
          APPROVAL_JSON: ${{ inputs.approval_json }}
        run: |
          if [ -z "$APPROVAL_JSON" ]; then
            echo '::error::approval_jsonが必要です。承認されていない動画は投稿しません'
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          episode = os.environ['EPISODE']
          approval = json.loads(os.environ['APPROVAL_JSON'])
          if not isinstance(approval, dict):
              raise SystemExit('approval_jsonはJSONオブジェクトが必要です')
          path = Path('episodes') / episode / 'approval.json'
          path.write_text(json.dumps(approval), encoding='utf-8')
          PY
      - name: Restore prior upload result for stage=all
        if: env.STAGE == 'all' && inputs.do_upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline.upload_result_store fetch --episode "$EPISODE"
      - name: Upload after stage=all
        id: upload
        if: env.STAGE == 'all' && inputs.do_upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: >-
          python -m pipeline.upload --episode "$EPISODE"
          --do-upload "$DO_UPLOAD"
          --video "output/$EPISODE/video/video.mp4"
          --thumbnail "output/$EPISODE/thumbnail/thumbnail.png"
      - name: Save stage=all upload result
        if: env.STAGE == 'all' && inputs.do_upload && steps.upload.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.episode }}-upload-result
          path: output/${{ inputs.episode }}/upload/upload_result.json
          if-no-files-found: error
          retention-days: 30
      - name: Summary
        if: always() && env.STAGE != 'voice' && env.STAGE != 'voice_samples'
        run: >-
          python -m pipeline.summary --episode "$EPISODE"
          --outcome "preflight=${{ steps.preflight.outcome }}"
          --outcome "voice=${{ steps.voice.outcome }}"
          --outcome "video=${{ steps.video.outcome }}"
          --outcome "thumbnail=${{ steps.thumbnail.outcome }}"
          --outcome "upload=${{ steps.upload.outcome }}"
          --warnings-file "$RUNNER_TEMP/warnings.txt"
          --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Engine logs on failure
        if: failure()
        run: docker logs --tail 100 speech-engine 2>/dev/null || true
      - name: Stop speech engine
        if: always()
        run: docker rm --force speech-engine 2>/dev/null || true

  publish-review:
    needs: generate
    # Fork PRs build and test, but cannot update the shared review branch.
    if: >-
      (github.event_name == 'workflow_dispatch' || inputs.publish_review) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      # One queue per episode/stage: a shared group cancels the older pending job when a third run queues.
      # publish_review.py retries when pushes to review-outputs race.
      group: review-outputs-${{ inputs.episode }}-${{ inputs.stage }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.episode }}-${{ inputs.stage }}-review
          path: review-input
      - name: Push only to review-outputs
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE: ${{ inputs.episode }}
          STAGE: ${{ inputs.stage }}
        run: |
          if [ "$STAGE" = all ]; then
            for stage in video thumbnail; do
              python -m pipeline.publish_review --source "review-input/$stage" --episode "$EPISODE" --stage "$stage"
            done
          else
            python -m pipeline.publish_review --source review-input --episode "$EPISODE" --stage "$STAGE"
          fi

  upload:
    if: inputs.stage == 'upload' || inputs.stage == 'upload_check'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      EPISODE: ${{ inputs.episode }}
      STAGE: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check YouTube connection and channel
        if: env.STAGE == 'upload_check'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m pipeline.upload --episode "$EPISODE" --check
      - name: Check upload inputs and write temporary approval
        if: env.STAGE == 'upload'
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          APPROVAL_JSON: ${{ inputs.approval_json }}
        run: |
          if ! [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::source_run_idには動画とサムネを生成した実行IDが必要です'
            exit 1
          fi
          if [ -z "$APPROVAL_JSON" ]; then
            echo '::error::approval_jsonが必要です。承認されていない動画は投稿しません'
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          episode = os.environ['EPISODE']
          if not episode.startswith('ep') or '/' in episode or '..' in episode:
              raise SystemExit('episode名が不正です')
          approval = json.loads(os.environ['APPROVAL_JSON'])
          if not isinstance(approval, dict):
              raise SystemExit('approval_jsonはJSONオブジェクトが必要です')
          path = Path('episodes') / episode / 'approval.json'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(approval), encoding='utf-8')
          PY
      - name: Restore prior upload result
        if: env.STAGE == 'upload'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline.upload_result_store fetch --episode "$EPISODE"
      - name: Download video artifact
        if: env.STAGE == 'upload'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.episode }}-video
          path: upload-input/video
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Download thumbnail artifact
        if: env.STAGE == 'upload'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.episode }}-thumbnail
          path: upload-input/thumbnail
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Upload approved episode
        if: env.STAGE == 'upload'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: >-
          python -m pipeline.upload --episode "$EPISODE"
          --video upload-input/video/video.mp4
          --thumbnail upload-input/thumbnail/thumbnail.png
      - name: Save upload result
        if: env.STAGE == 'upload'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.episode }}-upload-result
          path: output/${{ inputs.episode }}/upload/upload_result.json
          if-no-files-found: error
          retention-days: 30

  persist-upload-result:
    needs: [generate, upload]
    if: >-
      always() &&
      ((inputs.stage == 'all' && inputs.do_upload && needs.generate.result == 'success') ||
       (inputs.stage == 'upload' && needs.upload.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: upload-result-${{ inputs.episode }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.episode }}-upload-result
          path: result-input
      - name: Persist upload result to review-outputs
        run: |
          mkdir -p "output/$EPISODE/upload"
          cp result-input/upload_result.json "output/$EPISODE/upload/upload_result.json"
          python -m pipeline.upload_result_store publish --episode "$EPISODE"
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE: ${{ inputs.episode }}
